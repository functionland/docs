name: Test build on Pull Request

on:
  pull_request:
    branches:
      - '**'

jobs:
  deploy:
    name: Test build on PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: yarn
      - name: Test build
        run: |
          yarn install --frozen-lockfile
          yarn build
